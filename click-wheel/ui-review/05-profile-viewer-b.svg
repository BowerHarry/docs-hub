<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 660" font-family="-apple-system, 'SF Pro Text', system-ui, sans-serif">
  <style>
    .lbl{font-size:13px;font-weight:700;fill:#333}
    .note{font-size:11px;fill:#555}
    .name{font-size:18px;font-weight:700;fill:#1e1e1e}
    .meta{font-size:12px;fill:#6f6f6f}
    .muted{font-size:11px;fill:#9a9a9a}
    .sec{font-size:11px;font-weight:700;fill:#8a8a8a;letter-spacing:.06em}
    .action{font-size:12px;fill:#3b7cb8;font-weight:600}
    .cardn{font-size:13px;font-weight:700;fill:#222}
    .cardbig{font-size:20px;font-weight:700;fill:#1e1e1e}
    .cards{font-size:11px;fill:#7a7a7a}
    .row{font-size:13px;font-weight:700;fill:#222}
    .rowm{font-size:11px;fill:#7a7a7a}
  </style>
  <rect width="760" height="660" fill="#f4f4f4"/>
  <text x="30" y="26" class="lbl">B · OVERVIEW — media summary cards + stacked sections</text>

  <rect x="30" y="40" width="700" height="604" rx="6" fill="#fff" stroke="#cccccc"/>
  <rect x="31" y="41" width="698" height="40" fill="#f0f0f0"/>
  <line x1="30" y1="81" x2="730" y2="81" stroke="#cfcfcf"/>
  <text x="662" y="66" text-anchor="end" class="action">✎ Edit</text>
  <text x="708" y="66" text-anchor="end" class="muted" font-size="14">⋯</text>

  <text x="52" y="118" class="name">Weekend Mix</text>
  <text x="52" y="140" class="meta">14.1 GB total · Synced to iPod Classic</text>

  <!-- three media cards -->
  <g>
    <rect x="52" y="158" width="210" height="86" rx="4" fill="#fff" stroke="#e0e0e0"/>
    <circle cx="76" cy="184" r="12" fill="#eaf1f8"/><text x="76" y="188" text-anchor="middle" font-size="12" fill="#4d8cc7">♪</text>
    <text x="98" y="182" class="cardn">Music</text>
    <text x="72" y="218" class="cardbig">1,234</text><text x="150" y="218" class="cards">songs</text>
    <text x="72" y="236" class="cards">8.2 GB</text>

    <rect x="275" y="158" width="210" height="86" rx="4" fill="#fff" stroke="#e0e0e0"/>
    <circle cx="299" cy="184" r="12" fill="#eef0f2"/><text x="299" y="188" text-anchor="middle" font-size="12" fill="#6f6f6f">▣</text>
    <text x="321" y="182" class="cardn">Photos</text>
    <text x="295" y="218" class="cardbig">320</text><text x="345" y="218" class="cards">photos</text>
    <text x="295" y="236" class="cards">5.1 GB</text>

    <rect x="498" y="158" width="210" height="86" rx="4" fill="#fff" stroke="#e0e0e0"/>
    <circle cx="522" cy="184" r="12" fill="#eef0f2"/><text x="522" y="188" text-anchor="middle" font-size="12" fill="#6f6f6f">▶</text>
    <text x="544" y="182" class="cardn">Videos</text>
    <text x="518" y="218" class="cardbig">12</text><text x="552" y="218" class="cards">videos</text>
    <text x="518" y="236" class="cards">0.8 GB</text>
  </g>

  <!-- MUSIC section -->
  <text x="52" y="280" class="sec">MUSIC</text>
  <text x="708" y="280" text-anchor="end" class="action">See all</text>
  <rect x="52" y="292" width="40" height="40" rx="3" fill="#d8dde2"/>
  <text x="102" y="308" class="row">Collapsed in Sunbeams</text><text x="102" y="325" class="rowm">Arlo Parks · 12 songs</text>
  <rect x="360" y="292" width="40" height="40" rx="3" fill="#d8dde2"/>
  <text x="410" y="308" class="row">In Rainbows</text><text x="410" y="325" class="rowm">Radiohead · 10 songs</text>

  <!-- PHOTOS section -->
  <text x="52" y="368" class="sec">PHOTOS</text>
  <text x="708" y="368" text-anchor="end" class="action">See all</text>
  <rect x="52" y="380" width="48" height="48" rx="3" fill="#d8dde2"/>
  <rect x="108" y="380" width="48" height="48" rx="3" fill="#cfd6dc"/>
  <rect x="164" y="380" width="48" height="48" rx="3" fill="#d8dde2"/>
  <rect x="220" y="380" width="48" height="48" rx="3" fill="#cfd6dc"/>
  <rect x="276" y="380" width="48" height="48" rx="3" fill="#d8dde2"/>
  <rect x="332" y="380" width="48" height="48" rx="3" fill="#cfd6dc"/>
  <text x="396" y="408" class="rowm">Camera Roll · Italy 2025 · +314 more</text>

  <!-- VIDEOS section -->
  <text x="52" y="464" class="sec">VIDEOS</text>
  <text x="708" y="464" text-anchor="end" class="action">See all</text>
  <rect x="52" y="476" width="64" height="40" rx="3" fill="#d8dde2"/>
  <text x="128" y="492" class="row">Interstellar</text><text x="128" y="509" class="rowm">2h 49m · 480p · 620 MB</text>
  <rect x="360" y="476" width="64" height="40" rx="3" fill="#d8dde2"/>
  <text x="436" y="492" class="row">Planet Earth — Ep 1</text><text x="436" y="509" class="rowm">50m · 210 MB</text>

  <text x="52" y="566" class="note">Everything on one scroll. Cards give the headline numbers; each media type gets a</text>
  <text x="52" y="582" class="note">section with a peek + "See all". Photos read as a thumbnail strip, videos as rows.</text>
</svg>
