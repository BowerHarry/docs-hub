<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" font-family="-apple-system, 'SF Pro Text', system-ui, sans-serif">
  <style>
    .lbl{font-size:13px;font-weight:700;fill:#333}
    .note{font-size:11px;fill:#555}
    .tab{font-size:13px;fill:#666}
    .tabsel{font-size:13px;fill:#222;font-weight:600}
    .tabseg{font-size:13px;fill:#333}
    .tabsegA{font-size:13px;fill:#fff;font-weight:600}
    .tool{font-size:12px;fill:#555}
    .bad{font-size:10px;fill:#c0392b;font-weight:700}
    .good{font-size:10px;fill:#2e7d32;font-weight:700}
  </style>
  <rect width="760" height="320" fill="#f4f4f4"/>

  <!-- BEFORE -->
  <text x="30" y="30" class="lbl">BEFORE</text>
  <text x="110" y="30" class="note">four floating tabs left · controls scattered right · search expands the wrong way</text>
  <!-- window content top -->
  <rect x="30" y="42" width="700" height="96" rx="6" fill="#ffffff" stroke="#999"/>
  <!-- tab bar row -->
  <rect x="31" y="43" width="698" height="46" fill="#f0f0f0"/>
  <line x1="31" y1="89" x2="729" y2="89" stroke="#cccccc"/>
  <!-- selected Albums -->
  <rect x="44" y="53" width="66" height="26" rx="3" fill="#ffffff" stroke="#cccccc"/>
  <text x="55" y="70" class="tabsel">Albums</text>
  <text x="120" y="70" class="tab">Artists</text>
  <text x="176" y="70" class="tab">Songs</text>
  <text x="224" y="70" class="tab">Playlists</text>
  <!-- right cluster -->
  <rect x="520" y="55" width="52" height="22" rx="3" fill="#fff" stroke="#ccc"/>
  <text x="530" y="70" class="tool">▭▭</text>
  <text x="586" y="71" class="tool" font-size="16">≡</text>
  <rect x="612" y="55" width="104" height="22" rx="3" fill="#fff" stroke="#ccc"/>
  <text x="622" y="70" class="tool">⌕ Filter</text>
  <!-- content hint -->
  <rect x="44" y="100" width="40" height="30" rx="3" fill="#eee" stroke="#ddd"/>
  <rect x="92" y="100" width="40" height="30" rx="3" fill="#eee" stroke="#ddd"/>
  <rect x="140" y="100" width="40" height="30" rx="3" fill="#eee" stroke="#ddd"/>
  <!-- callouts -->
  <text x="300" y="70" class="bad">↔ big empty gap splits the row into two clusters</text>
  <text x="612" y="94" class="bad">search expands ◀ leftward (backwards on macOS)</text>

  <!-- AFTER -->
  <text x="30" y="196" class="lbl">AFTER</text>
  <text x="110" y="196" class="note">one segmented control · single tidy right toolbar · conventional order</text>
  <rect x="30" y="208" width="700" height="96" rx="6" fill="#ffffff" stroke="#999"/>
  <rect x="31" y="209" width="698" height="46" fill="#f0f0f0"/>
  <line x1="31" y1="255" x2="729" y2="255" stroke="#cccccc"/>
  <!-- segmented control -->
  <rect x="44" y="220" width="272" height="26" rx="3" fill="#ffffff" stroke="#bbb"/>
  <rect x="45" y="221" width="68" height="24" rx="2" fill="#4d8cc7"/>
  <text x="57" y="238" class="tabsegA">Albums</text>
  <line x1="113" y1="223" x2="113" y2="243" stroke="#ddd"/>
  <text x="122" y="238" class="tabseg">Artists</text>
  <line x1="181" y1="223" x2="181" y2="243" stroke="#ddd"/>
  <text x="190" y="238" class="tabseg">Songs</text>
  <line x1="245" y1="223" x2="245" y2="243" stroke="#ddd"/>
  <text x="254" y="238" class="tabseg">Playlists</text>
  <!-- right toolbar: search + sort + filter + view -->
  <rect x="486" y="220" width="130" height="26" rx="3" fill="#fff" stroke="#bbb"/>
  <text x="496" y="238" class="tool">⌕ Filter</text>
  <text x="632" y="238" class="tool">⇅ Sort</text>
  <text x="686" y="238" class="tool">▚ View</text>
  <!-- content hint -->
  <rect x="44" y="266" width="40" height="30" rx="3" fill="#eee" stroke="#ddd"/>
  <rect x="92" y="266" width="40" height="30" rx="3" fill="#eee" stroke="#ddd"/>
  <rect x="140" y="266" width="40" height="30" rx="3" fill="#eee" stroke="#ddd"/>
  <text x="330" y="238" class="good">tabs read as one set → balanced, conventional</text>
</svg>
