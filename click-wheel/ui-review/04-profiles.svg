<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" font-family="-apple-system, 'SF Pro Text', system-ui, sans-serif">
  <style>
    .lbl{font-size:13px;font-weight:700;fill:#333}
    .note{font-size:11px;fill:#555}
    .name{font-size:14px;font-weight:700;fill:#212121}
    .meta{font-size:12px;fill:#6f6f6f}          /* secondary metadata — plain text, no pills */
    .muted{font-size:11px;fill:#9a9a9a}
    .toolL{font-size:12px;fill:#8a8a8a}
    .action{font-size:12px;fill:#3b7cb8;font-weight:600} /* subtle borderless icon+text */
    .sec{font-size:11px;font-weight:700;fill:#8a8a8a;letter-spacing:.06em}
    .btnW{font-size:12px;font-weight:600;fill:#fff}
    .good{font-size:10px;fill:#2e7d32;font-weight:700}
  </style>
  <rect width="760" height="620" fill="#f4f4f4"/>
  <text x="30" y="26" class="lbl">SYNC PROFILES — v2 (design language)</text>
  <text x="285" y="26" class="note">no page title · no pills · no colour bars · subtle icon+text actions</text>

  <!-- content pane -->
  <rect x="30" y="40" width="700" height="420" rx="6" fill="#ffffff" stroke="#cccccc"/>

  <!-- toolbar row (matches Library: grey bar, bottom border, context left / actions right) -->
  <rect x="31" y="41" width="698" height="40" fill="#f0f0f0"/>
  <line x1="30" y1="81" x2="730" y2="81" stroke="#cfcfcf"/>
  <text x="52" y="66" class="toolL">4 profiles</text>
  <text x="708" y="66" text-anchor="end" class="action">＋ New Profile</text>

  <!-- ===== card 1 ===== -->
  <rect x="48" y="98" width="664" height="72" rx="3" fill="#fff" stroke="#e0e0e0"/>
  <text x="66" y="126" class="name">iPod Profile</text>
  <text x="66" y="148" class="meta">13 songs · 305 MB · 2 albums · 1 playlist</text>
  <text x="694" y="122" text-anchor="end" class="muted">iPod Classic</text>
  <text x="694" y="140" text-anchor="end" class="muted">Synced today</text>
  <text x="628" y="160" text-anchor="end" class="action">✎ Edit</text>
  <text x="694" y="160" text-anchor="end" class="muted">⋯</text>

  <!-- ===== card 2 ===== -->
  <rect x="48" y="182" width="664" height="72" rx="3" fill="#fff" stroke="#e0e0e0"/>
  <text x="66" y="210" class="name">STEF POD Profile</text>
  <text x="66" y="232" class="meta">993 songs · 23.9 GB · 68 albums · 4 playlists</text>
  <text x="694" y="206" text-anchor="end" class="muted">STEF POD</text>
  <text x="694" y="224" text-anchor="end" class="muted">Synced 3 days ago</text>
  <text x="628" y="244" text-anchor="end" class="action">✎ Edit</text>
  <text x="694" y="244" text-anchor="end" class="muted">⋯</text>

  <!-- ===== card 3 ===== -->
  <rect x="48" y="266" width="664" height="72" rx="3" fill="#fff" stroke="#e0e0e0"/>
  <text x="66" y="294" class="name">Entire Library</text>
  <text x="66" y="316" class="meta">2,584 songs · 61.2 GB · everything</text>
  <text x="694" y="290" text-anchor="end" class="muted">Not assigned</text>
  <text x="694" y="308" text-anchor="end" class="muted">Synced yesterday</text>
  <text x="628" y="328" text-anchor="end" class="action">✎ Edit</text>
  <text x="694" y="328" text-anchor="end" class="muted">⋯</text>

  <text x="48" y="384" class="good">✓ one column · click a card or ✎ Edit → the single library editor</text>
  <text x="48" y="402" class="good">✓ metadata is plain lighter text (· separated), never bordered pills</text>
  <text x="48" y="420" class="good">✓ header matches Library: grey bar, count on the left, subtle action on the right — no big title</text>

  <!-- ===== design-language legend ===== -->
  <text x="30" y="492" class="sec">DESIGN LANGUAGE — shared pieces</text>

  <!-- buttons -->
  <text x="30" y="516" class="muted">Buttons</text>
  <rect x="30" y="524" width="96" height="26" rx="3" fill="#4d8cc7" stroke="#2e6aa8"/>
  <text x="78" y="541" text-anchor="middle" class="btnW">Sync</text>
  <text x="150" y="541" class="action">✎ Edit</text>
  <text x="150" y="556" class="muted" font-size="9">subtle (icon+text, no border)</text>
  <rect x="250" y="524" width="96" height="26" rx="3" fill="#fff" stroke="#bcbcbc"/>
  <text x="298" y="541" text-anchor="middle" fill="#333" font-size="12" font-weight="600">Cancel</text>
  <text x="250" y="566" class="muted" font-size="9">primary · subtle · outline</text>

  <!-- section label + meta -->
  <text x="400" y="516" class="muted">Text</text>
  <text x="400" y="536" class="sec">DETAILS</text>
  <text x="400" y="536" class="sec"> </text>
  <text x="400" y="554" class="name" font-size="13">Album Name</text>
  <text x="470" y="554" class="meta">· 12 songs · 42 min</text>
  <text x="400" y="572" class="muted" font-size="9">section label (caps, muted) · name (bold) + meta (· separated, lighter)</text>

  <!-- surfaces -->
  <text x="620" y="516" class="muted">Surfaces</text>
  <rect x="620" y="524" width="110" height="40" rx="3" fill="#fff" stroke="#cccccc"/>
  <rect x="630" y="534" width="90" height="20" rx="3" fill="#f5f5f5" stroke="#e3e3e3"/>
  <text x="620" y="580" class="muted" font-size="9">card (white, 3pt, 1px) · inset</text>
</svg>
