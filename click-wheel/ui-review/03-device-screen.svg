<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" font-family="-apple-system, 'SF Pro Text', system-ui, sans-serif">
  <style>
    .lbl{font-size:13px;font-weight:700;fill:#333}
    .note{font-size:11px;fill:#555}
    .h{font-size:12px;font-weight:700;fill:#333}
    .t{font-size:11px;fill:#333}
    .m{font-size:11px;fill:#7a7a7a}
    .btn{font-size:12px;font-weight:600;fill:#fff}
    .bad{font-size:10px;fill:#c0392b;font-weight:700}
    .good{font-size:10px;fill:#2e7d32;font-weight:700}
  </style>
  <rect width="760" height="480" fill="#f4f4f4"/>

  <!-- BEFORE -->
  <text x="30" y="30" class="lbl">BEFORE</text>
  <text x="110" y="30" class="note">two competing cards · hero iPod art (4pt) · glassy fields · card-in-card</text>
  <rect x="30" y="42" width="340" height="420" rx="6" fill="#ffffff" stroke="#999"/>
  <!-- left card: iPod illustration -->
  <rect x="46" y="60" width="150" height="384" rx="3" fill="#fff" stroke="#cccccc"/>
  <rect x="72" y="76" width="98" height="150" rx="9" fill="#dfe3e6" stroke="#b8b8b8" stroke-width="2"/>
  <rect x="84" y="88" width="74" height="60" rx="3" fill="#cfd4d8"/>
  <circle cx="121" cy="192" r="22" fill="#eceef0" stroke="#c6c6c6"/>
  <text x="121" y="250" text-anchor="middle" class="h">iPod Classic</text>
  <text x="121" y="266" text-anchor="middle" class="m">512 GB</text>
  <!-- glassy name field -->
  <rect x="60" y="278" width="122" height="22" rx="3" fill="#ffffff" opacity="0.85" stroke="#cccccc"/>
  <text x="66" y="293" class="m">Name…</text>
  <text x="60" y="322" class="m">Capacity   512 GB</text>
  <text x="60" y="340" class="m">Songs      2,584</text>
  <text x="60" y="358" class="m">Version    1.1.2</text>
  <!-- rounded-cap storage bar -->
  <rect x="60" y="372" width="122" height="12" rx="6" fill="#e6e6e6"/>
  <rect x="60" y="372" width="30" height="12" rx="6" fill="#4d8cc7"/>
  <!-- right card: sync -->
  <rect x="206" y="60" width="150" height="384" rx="3" fill="#fff" stroke="#cccccc"/>
  <text x="218" y="80" class="h">Sync to iPod</text>
  <text x="338" y="80" class="m">⚙</text>
  <rect x="218" y="92" width="10" height="10" fill="#fff" stroke="#999"/><text x="234" y="101" class="t">Profile A</text>
  <rect x="218" y="110" width="10" height="10" fill="#4d8cc7" stroke="#2e6aa8"/><text x="234" y="119" class="t">Profile B</text>
  <!-- nested inset summary card -->
  <rect x="218" y="132" width="126" height="60" rx="3" fill="#f4f4f4" stroke="#cccccc"/>
  <text x="226" y="150" class="m">Songs      2,584</text>
  <text x="226" y="166" class="m">Size       43.8 GB</text>
  <text x="226" y="182" class="m">Est. time  ~44 min</text>
  <!-- sync button -->
  <rect x="218" y="404" width="126" height="28" rx="3" fill="#4d8cc7" stroke="#2e6aa8"/>
  <text x="281" y="422" text-anchor="middle" class="btn">Sync Now</text>
  <!-- callouts -->
  <text x="70" y="74" class="bad">4pt “bulbous” art</text>
  <text x="222" y="128" class="bad">card-in-card ▾</text>

  <!-- AFTER -->
  <text x="400" y="30" class="lbl">AFTER</text>
  <text x="480" y="30" class="note">one inspector · quiet sections · flat 3pt · no gloss/nesting</text>
  <rect x="400" y="42" width="330" height="420" rx="6" fill="#ffffff" stroke="#999"/>
  <rect x="416" y="60" width="298" height="180" rx="3" fill="#fff" stroke="#cccccc"/>
  <!-- device section -->
  <rect x="430" y="76" width="34" height="34" rx="3" fill="#eceef0" stroke="#c6c6c6"/>
  <rect x="438" y="82" width="18" height="22" rx="2" fill="#cfd4d8"/>
  <text x="476" y="88" class="h">iPod Classic</text>
  <text x="476" y="104" class="m">Video 5th gen · 512 GB</text>
  <circle cx="480" cy="122" r="4" fill="#45a05a"/><text x="490" y="126" class="t">Connected</text>
  <!-- flat storage bar -->
  <rect x="430" y="140" width="270" height="10" fill="#ececec" stroke="#d8d8d8"/>
  <rect x="430" y="140" width="66" height="10" fill="#4d8cc7"/>
  <text x="430" y="168" class="m">43.8 GB used of 512 GB · 2,584 songs</text>
  <text x="430" y="192" class="m">Last synced: Entire Library · today 15:25</text>
  <!-- divider between sections -->
  <line x1="416" y1="240" x2="714" y2="240" stroke="#e2e2e2"/>
  <!-- sync section -->
  <rect x="416" y="252" width="298" height="196" rx="3" fill="#fff" stroke="#cccccc"/>
  <text x="430" y="274" class="h">Sync</text>
  <text x="430" y="298" class="m">Active profile</text>
  <rect x="430" y="306" width="270" height="24" rx="3" fill="#fff" stroke="#bbb"/>
  <text x="440" y="322" class="t">Entire Library</text><text x="690" y="322" class="m">▾</text>
  <text x="430" y="350" class="m">2,584 songs · 43.8 GB · 3 playlists</text>
  <rect x="430" y="404" width="270" height="30" rx="3" fill="#4d8cc7" stroke="#2e6aa8"/>
  <text x="565" y="423" text-anchor="middle" class="btn">Sync Now</text>
  <text x="430" y="230" class="good">compact header, not hero art</text>
  <text x="430" y="392" class="good">flat fields · one bordered shell per section</text>
</svg>
