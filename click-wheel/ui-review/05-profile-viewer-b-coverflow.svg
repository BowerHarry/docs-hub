<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 720" font-family="-apple-system, 'SF Pro Text', system-ui, sans-serif">
  <style>
    .lbl{font-size:13px;font-weight:700;fill:#333}
    .note{font-size:11px;fill:#555}
    .name{font-size:18px;font-weight:700;fill:#1e1e1e}
    .meta{font-size:12px;fill:#6f6f6f}
    .muted{font-size:11px;fill:#9a9a9a}
    .sec{font-size:11px;font-weight:700;fill:#8a8a8a;letter-spacing:.06em}
    .action{font-size:12px;fill:#3b7cb8;font-weight:600}
    .cardn{font-size:13px;font-weight:700;fill:#222}
    .cardbig{font-size:20px;font-weight:700;fill:#1e1e1e}
    .cards{font-size:11px;fill:#7a7a7a}
    .cfName{font-size:13px;font-weight:700;fill:#1e1e1e}
    .cfArtist{font-size:11px;fill:#7a7a7a}
    .row{font-size:13px;font-weight:700;fill:#222}
    .rowm{font-size:11px;fill:#7a7a7a}
  </style>
  <defs>
    <linearGradient id="refl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>
  </defs>
  <rect width="760" height="720" fill="#f4f4f4"/>
  <text x="30" y="26" class="lbl">B · dashboard + Music Cover Flow</text>

  <rect x="30" y="40" width="700" height="664" rx="6" fill="#fff" stroke="#cccccc"/>
  <rect x="31" y="41" width="698" height="40" fill="#f0f0f0"/>
  <line x1="30" y1="81" x2="730" y2="81" stroke="#cfcfcf"/>
  <text x="662" y="66" text-anchor="end" class="action">✎ Edit</text>
  <text x="708" y="66" text-anchor="end" class="muted" font-size="14">⋯</text>

  <text x="52" y="116" class="name">Weekend Mix</text>
  <text x="52" y="137" class="meta">14.1 GB total · Synced to iPod Classic</text>

  <!-- three media cards -->
  <rect x="52" y="156" width="210" height="84" rx="4" fill="#fff" stroke="#e0e0e0"/>
  <circle cx="76" cy="182" r="12" fill="#eaf1f8"/><text x="76" y="186" text-anchor="middle" font-size="12" fill="#4d8cc7">♪</text>
  <text x="98" y="180" class="cardn">Music</text>
  <text x="72" y="216" class="cardbig">1,234</text><text x="150" y="216" class="cards">songs</text>
  <text x="72" y="233" class="cards">8.2 GB</text>

  <rect x="275" y="156" width="210" height="84" rx="4" fill="#fff" stroke="#e0e0e0"/>
  <circle cx="299" cy="182" r="12" fill="#eef0f2"/><text x="299" y="186" text-anchor="middle" font-size="12" fill="#6f6f6f">▣</text>
  <text x="321" y="180" class="cardn">Photos</text>
  <text x="295" y="216" class="cardbig">320</text><text x="345" y="216" class="cards">photos</text>
  <text x="295" y="233" class="cards">5.1 GB</text>

  <rect x="498" y="156" width="210" height="84" rx="4" fill="#fff" stroke="#e0e0e0"/>
  <circle cx="522" cy="182" r="12" fill="#eef0f2"/><text x="522" y="186" text-anchor="middle" font-size="12" fill="#6f6f6f">▶</text>
  <text x="544" y="180" class="cardn">Videos</text>
  <text x="518" y="216" class="cardbig">12</text><text x="552" y="216" class="cards">videos</text>
  <text x="518" y="233" class="cards">0.8 GB</text>

  <!-- MUSIC — Cover Flow -->
  <text x="52" y="274" class="sec">MUSIC · 142 albums</text>
  <text x="708" y="274" text-anchor="end" class="action">See all</text>

  <!-- coverflow band -->
  <rect x="52" y="286" width="656" height="150" rx="4" fill="#fafbfc" stroke="#eceef0"/>
  <!-- far left / right -->
  <g transform="translate(196,320) skewY(-13)"><rect width="54" height="76" fill="#9a8fc4" stroke="#6f66a0" opacity="0.8"/></g>
  <g transform="translate(508,320) skewY(13)"><rect width="54" height="76" fill="#8fbfa0" stroke="#5f8f70" opacity="0.8"/></g>
  <!-- near left / right -->
  <g transform="translate(258,312) skewY(-9)"><rect width="70" height="86" fill="#c48f9a" stroke="#9a5f6a"/></g>
  <g transform="translate(432,312) skewY(9)"><rect width="70" height="86" fill="#8ea9c4" stroke="#5f7f9a"/></g>
  <!-- center + reflection -->
  <rect x="332" y="386" width="96" height="34" fill="#c9a27a"/>
  <rect x="332" y="386" width="96" height="34" fill="url(#refl)"/>
  <rect x="332" y="300" width="96" height="96" fill="#c9a27a" stroke="#9c7a52" stroke-width="1.5"/>
  <rect x="352" y="356" width="30" height="30" fill="#fff" opacity="0.85"/>
  <text x="357" y="374" font-size="8" fill="#333">ALBUM</text>

  <text x="380" y="452" text-anchor="middle" class="cfName">Collapsed in Sunbeams</text>
  <text x="380" y="468" text-anchor="middle" class="cfArtist">Arlo Parks · 12 songs · 282 MB</text>

  <!-- PHOTOS -->
  <text x="52" y="506" class="sec">PHOTOS · 8 albums</text>
  <text x="708" y="506" text-anchor="end" class="action">See all</text>
  <rect x="52" y="518" width="52" height="52" rx="3" fill="#d8dde2"/>
  <rect x="112" y="518" width="52" height="52" rx="3" fill="#cfd6dc"/>
  <rect x="172" y="518" width="52" height="52" rx="3" fill="#d8dde2"/>
  <rect x="232" y="518" width="52" height="52" rx="3" fill="#cfd6dc"/>
  <rect x="292" y="518" width="52" height="52" rx="3" fill="#d8dde2"/>
  <text x="368" y="548" class="rowm">Italy 2025 · Camera Roll · +6 albums</text>

  <!-- VIDEOS -->
  <text x="52" y="606" class="sec">VIDEOS · 12 videos</text>
  <text x="708" y="606" text-anchor="end" class="action">See all</text>
  <rect x="52" y="618" width="64" height="40" rx="3" fill="#d8dde2"/>
  <text x="128" y="634" class="row">Interstellar</text><text x="128" y="651" class="rowm">2h 49m · 480p · 620 MB</text>
  <rect x="360" y="618" width="64" height="40" rx="3" fill="#d8dde2"/>
  <text x="436" y="634" class="row">Planet Earth — Ep 1</text><text x="436" y="651" class="rowm">50m · 210 MB</text>

  <text x="30" y="694" class="note">Music preview = a horizontally-scrollable Cover Flow of selected albums (centre = focus, title/artist below). Photos = thumbnail strip · Videos = rows.</text>
</svg>
