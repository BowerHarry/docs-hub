<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" font-family="-apple-system, 'SF Pro Text', system-ui, sans-serif">
  <style>
    .lbl{font-size:13px;font-weight:700;fill:#333}
    .note{font-size:11px;fill:#555}
    .name{font-size:18px;font-weight:700;fill:#1e1e1e}
    .meta{font-size:12px;fill:#6f6f6f}
    .muted{font-size:11px;fill:#9a9a9a}
    .sec{font-size:11px;font-weight:700;fill:#8a8a8a;letter-spacing:.06em}
    .action{font-size:12px;fill:#3b7cb8;font-weight:600}
    .tab{font-size:13px;font-weight:600;fill:#333}
    .tabsel{font-size:13px;font-weight:600;fill:#fff}
    .row{font-size:13px;font-weight:700;fill:#222}
    .rowm{font-size:11px;fill:#7a7a7a}
    .leg{font-size:10px;fill:#8a8a8a}
  </style>
  <rect width="760" height="640" fill="#f4f4f4"/>
  <text x="30" y="26" class="lbl">A · MANIFEST — composition bar + media tabs</text>

  <rect x="30" y="40" width="700" height="584" rx="6" fill="#fff" stroke="#cccccc"/>
  <!-- toolbar -->
  <rect x="31" y="41" width="698" height="40" fill="#f0f0f0"/>
  <line x1="30" y1="81" x2="730" y2="81" stroke="#cfcfcf"/>
  <text x="662" y="66" text-anchor="end" class="action">✎ Edit</text>
  <text x="708" y="66" text-anchor="end" class="muted" font-size="14">⋯</text>

  <!-- header -->
  <text x="52" y="118" class="name">Weekend Mix</text>
  <text x="52" y="140" class="meta">1,234 songs · 320 photos · 12 videos</text>
  <text x="52" y="158" class="muted">14.1 GB total · Synced to iPod Classic</text>

  <!-- composition bar -->
  <text x="52" y="190" class="sec">WHAT'S INSIDE</text>
  <rect x="52" y="200" width="656" height="14" rx="3" fill="#ececec" stroke="#d8d8d8"/>
  <rect x="52" y="200" width="382" height="14" fill="#4d8cc7"/>
  <rect x="434" y="200" width="238" height="14" fill="#9aa0a6"/>
  <rect x="672" y="200" width="36" height="14" fill="#6f6f6f"/>
  <rect x="705" y="200" width="3" height="14" fill="#6f6f6f"/>
  <circle cx="56" cy="230" r="4" fill="#4d8cc7"/><text x="66" y="234" class="leg">Music 8.2 GB</text>
  <circle cx="176" cy="230" r="4" fill="#9aa0a6"/><text x="186" y="234" class="leg">Photos 5.1 GB</text>
  <circle cx="300" cy="230" r="4" fill="#6f6f6f"/><text x="310" y="234" class="leg">Videos 0.8 GB</text>

  <!-- segmented media tabs -->
  <rect x="52" y="252" width="230" height="30" rx="3" fill="#f5f5f5" stroke="#dddddd"/>
  <rect x="54" y="254" width="76" height="26" rx="2" fill="#4d8cc7"/>
  <text x="92" y="271" text-anchor="middle" class="tabsel">Music</text>
  <text x="168" y="271" text-anchor="middle" class="tab">Photos</text>
  <text x="245" y="271" text-anchor="middle" class="tab">Videos</text>

  <!-- content list (Music) -->
  <g>
    <rect x="52" y="298" width="44" height="44" rx="3" fill="#d8dde2"/>
    <text x="108" y="316" class="row">Collapsed in Sunbeams</text>
    <text x="108" y="334" class="rowm">Arlo Parks · 12 songs · 282 MB</text>
    <line x1="52" y1="356" x2="708" y2="356" stroke="#eee"/>
    <rect x="52" y="366" width="44" height="44" rx="3" fill="#d8dde2"/>
    <text x="108" y="384" class="row">In Rainbows</text>
    <text x="108" y="402" class="rowm">Radiohead · 10 songs · 260 MB</text>
    <line x1="52" y1="424" x2="708" y2="424" stroke="#eee"/>
    <rect x="52" y="434" width="44" height="44" rx="3" fill="#d8dde2"/>
    <text x="108" y="452" class="row">Blonde</text>
    <text x="108" y="470" class="rowm">Frank Ocean · 17 songs · 410 MB</text>
    <line x1="52" y1="492" x2="708" y2="492" stroke="#eee"/>
  </g>
  <text x="52" y="514" class="muted">+ 128 more albums · switch tabs to see photos &amp; videos in this profile</text>

  <text x="52" y="560" class="note">One pane. The composition bar = the device storage bar, broken down by media type. Tabs</text>
  <text x="52" y="576" class="note">show the profile's *contents* (read-only) — you change what's in it with Edit.</text>
</svg>
