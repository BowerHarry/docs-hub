<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" font-family="-apple-system, 'SF Pro Text', system-ui, sans-serif">
  <style>
    .lbl{font-size:13px;font-weight:700;fill:#333}
    .grp{font-size:10px;font-weight:700;fill:#8a8a8a;letter-spacing:.08em}
    .row{font-size:13px;fill:#222}
    .rowm{font-size:13px;fill:#9a9a9a}
    .rowsel{font-size:13px;fill:#fff;font-weight:600}
    .soon{font-size:10px;fill:#b0b0b0}
    .cap{font-size:10px;fill:#888}
    .note{font-size:11px;fill:#555}
  </style>
  <rect width="760" height="540" fill="#f4f4f4"/>

  <!-- ============ BEFORE ============ -->
  <text x="40" y="34" class="lbl">BEFORE</text>
  <text x="40" y="52" class="note">device dropdown + flat 3-item nav</text>
  <!-- window -->
  <rect x="40" y="64" width="300" height="440" rx="6" fill="#c7c7c7" stroke="#999"/>
  <rect x="40" y="64" width="300" height="26" rx="6" fill="#c7c7c7"/>
  <circle cx="58" cy="77" r="4" fill="#e06b5e"/><circle cx="72" cy="77" r="4" fill="#e5b34a"/><circle cx="86" cy="77" r="4" fill="#5aa35a"/>
  <!-- sidebar pane -->
  <rect x="41" y="90" width="180" height="413" fill="#e8e8e8"/>
  <!-- device dropdown card -->
  <rect x="53" y="102" width="156" height="40" rx="3" fill="#f6f6f6" stroke="#cccccc"/>
  <circle cx="66" cy="122" r="4" fill="#45a05a"/>
  <text x="76" y="126" class="row" font-size="12">Connected</text>
  <text x="176" y="126" class="rowm" font-size="12">⏏</text>
  <text x="196" y="127" class="rowm" font-size="14">≡</text>
  <line x1="53" y1="156" x2="209" y2="156" stroke="#999"/>
  <text x="53" y="178" class="grp">LIBRARY</text>
  <text x="62" y="205" class="row">Device</text>
  <!-- selected Music -->
  <rect x="53" y="216" width="156" height="30" rx="3" fill="#4d8cc7" stroke="#2e6aa8"/>
  <text x="62" y="236" class="rowsel">Music</text>
  <text x="62" y="271" class="row">Profiles</text>
  <line x1="53" y1="474" x2="209" y2="474" stroke="#bbb"/>
  <text x="53" y="493" class="cap">v1.0</text>
  <!-- content stub -->
  <rect x="221" y="90" width="118" height="413" fill="#ffffff"/>
  <!-- callout -->
  <text x="52" y="150" font-size="16" fill="#c0392b">◀</text>
  <text x="230" y="120" font-size="10" fill="#c0392b" font-weight="700">popover</text>
  <text x="230" y="132" font-size="10" fill="#c0392b" font-weight="700">dropdown</text>
  <text x="230" y="144" font-size="10" fill="#c0392b">(hidden in a</text>
  <text x="230" y="156" font-size="10" fill="#c0392b">fussy card)</text>

  <!-- ============ AFTER ============ -->
  <text x="420" y="34" class="lbl">AFTER</text>
  <text x="420" y="52" class="note">macOS source list · devices as rows · dropdown removed</text>
  <rect x="420" y="64" width="300" height="440" rx="6" fill="#c7c7c7" stroke="#999"/>
  <rect x="420" y="64" width="300" height="26" rx="6" fill="#c7c7c7"/>
  <circle cx="438" cy="77" r="4" fill="#e06b5e"/><circle cx="452" cy="77" r="4" fill="#e5b34a"/><circle cx="466" cy="77" r="4" fill="#5aa35a"/>
  <rect x="421" y="90" width="180" height="413" fill="#e8e8e8"/>

  <text x="437" y="116" class="grp">LIBRARY</text>
  <!-- Music selected? no; keep Music normal, device selected below -->
  <text x="446" y="141" class="row">♪&#160;&#160;Music</text>
  <text x="446" y="167" class="rowm">▣&#160;&#160;Photos</text>
  <text x="558" y="167" class="soon">soon</text>
  <text x="446" y="193" class="rowm">▶&#160;&#160;Videos</text>
  <text x="558" y="193" class="soon">soon</text>

  <text x="437" y="233" class="grp">DEVICES</text>
  <!-- selected device -->
  <rect x="433" y="242" width="156" height="30" rx="3" fill="#4d8cc7" stroke="#2e6aa8"/>
  <circle cx="447" cy="257" r="4" fill="#ffffff"/>
  <text x="459" y="261" class="rowsel">iPod Classic</text>
  <!-- disconnected device -->
  <circle cx="447" cy="291" r="4" fill="none" stroke="#a8a8a8"/>
  <text x="459" y="295" class="rowm">Harry · Nano 2G</text>
  <!-- profiles -->
  <text x="446" y="325" class="row">⧉&#160;&#160;Sync Profiles</text>

  <line x1="433" y1="474" x2="589" y2="474" stroke="#bbb"/>
  <text x="433" y="493" class="cap">v1.0</text>
  <rect x="601" y="90" width="118" height="413" fill="#ffffff"/>

  <!-- callouts -->
  <text x="601" y="258" font-size="10" fill="#2e7d32" font-weight="700">◀ status dot</text>
  <text x="601" y="270" font-size="10" fill="#2e7d32">inline, always</text>
  <text x="601" y="282" font-size="10" fill="#2e7d32">visible</text>
  <text x="601" y="330" font-size="10" fill="#2e7d32" font-weight="700">◀ Profiles: own</text>
  <text x="601" y="342" font-size="10" fill="#2e7d32">screen, grouped</text>
  <text x="601" y="354" font-size="10" fill="#2e7d32">with devices</text>
</svg>
