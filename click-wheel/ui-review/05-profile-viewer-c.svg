<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" font-family="-apple-system, 'SF Pro Text', system-ui, sans-serif">
  <style>
    .lbl{font-size:13px;font-weight:700;fill:#333}
    .note{font-size:11px;fill:#555}
    .name{font-size:18px;font-weight:700;fill:#1e1e1e}
    .meta{font-size:12px;fill:#6f6f6f}
    .muted{font-size:11px;fill:#9a9a9a}
    .sec{font-size:11px;font-weight:700;fill:#8a8a8a;letter-spacing:.06em}
    .cnt{font-size:11px;fill:#9a9a9a;font-weight:600}
    .action{font-size:12px;fill:#3b7cb8;font-weight:600}
    .row{font-size:13px;font-weight:700;fill:#222}
    .rowm{font-size:11px;fill:#7a7a7a}
    .rail{font-size:11px;font-weight:600;fill:#333}
    .railsel{font-size:11px;font-weight:700;fill:#3b7cb8}
  </style>
  <rect width="760" height="620" fill="#f4f4f4"/>
  <text x="30" y="26" class="lbl">C · UNIFIED — quiet header + jump rail + one continuous scroll</text>

  <rect x="30" y="40" width="700" height="560" rx="6" fill="#fff" stroke="#cccccc"/>
  <rect x="31" y="41" width="698" height="40" fill="#f0f0f0"/>
  <line x1="30" y1="81" x2="730" y2="81" stroke="#cfcfcf"/>
  <text x="52" y="66" class="meta" font-weight="700" fill="#1e1e1e">Weekend Mix</text>
  <text x="662" y="66" text-anchor="end" class="action">✎ Edit</text>
  <text x="708" y="66" text-anchor="end" class="muted" font-size="14">⋯</text>

  <!-- summary strip -->
  <text x="52" y="108" class="meta">1,234 songs · 320 photos · 12 videos · 14.1 GB · Synced to iPod Classic</text>
  <rect x="52" y="120" width="656" height="10" rx="3" fill="#ececec" stroke="#d8d8d8"/>
  <rect x="52" y="120" width="382" height="10" fill="#4d8cc7"/>
  <rect x="434" y="120" width="238" height="10" fill="#9aa0a6"/>
  <rect x="672" y="120" width="36" height="10" fill="#6f6f6f"/>

  <!-- left jump rail -->
  <line x1="150" y1="150" x2="150" y2="580" stroke="#eee"/>
  <text x="52" y="172" class="railsel">Music</text>
  <text x="52" y="196" class="rail">Photos</text>
  <text x="52" y="220" class="rail">Videos</text>
  <text x="52" y="250" class="muted" font-size="10">jumps/scrolls</text>
  <text x="52" y="264" class="muted" font-size="10">to a section</text>

  <!-- content column -->
  <text x="176" y="168" class="sec">MUSIC</text><text x="176" y="168" class="cnt" dx="60">· 1,234 songs</text>
  <rect x="176" y="180" width="40" height="40" rx="3" fill="#d8dde2"/>
  <text x="226" y="196" class="row">Collapsed in Sunbeams</text><text x="226" y="213" class="rowm">Arlo Parks · 12 songs · 282 MB</text>
  <line x1="176" y1="232" x2="708" y2="232" stroke="#f0f0f0"/>
  <rect x="176" y="242" width="40" height="40" rx="3" fill="#d8dde2"/>
  <text x="226" y="258" class="row">In Rainbows</text><text x="226" y="275" class="rowm">Radiohead · 10 songs · 260 MB</text>

  <text x="176" y="316" class="sec">PHOTOS</text><text x="176" y="316" class="cnt" dx="66">· 320 photos</text>
  <rect x="176" y="328" width="44" height="44" rx="3" fill="#d8dde2"/>
  <rect x="228" y="328" width="44" height="44" rx="3" fill="#cfd6dc"/>
  <rect x="280" y="328" width="44" height="44" rx="3" fill="#d8dde2"/>
  <rect x="332" y="328" width="44" height="44" rx="3" fill="#cfd6dc"/>
  <rect x="384" y="328" width="44" height="44" rx="3" fill="#d8dde2"/>
  <text x="176" y="392" class="rowm">Italy 2025 · Camera Roll · +6 albums</text>

  <text x="176" y="430" class="sec">VIDEOS</text><text x="176" y="430" class="cnt" dx="60">· 12 videos</text>
  <rect x="176" y="442" width="60" height="38" rx="3" fill="#d8dde2"/>
  <text x="246" y="458" class="row">Interstellar</text><text x="246" y="475" class="rowm">2h 49m · 480p · 620 MB</text>
  <line x1="176" y1="494" x2="708" y2="494" stroke="#f0f0f0"/>
  <rect x="176" y="504" width="60" height="38" rx="3" fill="#d8dde2"/>
  <text x="246" y="520" class="row">Planet Earth — Ep 1</text><text x="246" y="537" class="rowm">50m · 210 MB</text>

  <text x="52" y="592" class="note">Minimal chrome: a slim jump rail + one continuous scroll, section per media type. No tabs to click through.</text>
</svg>
